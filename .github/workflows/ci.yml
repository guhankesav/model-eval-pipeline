name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -W error::RuntimeWarning
      - name: Broken config is rejected before any compute
        run: |
          python -m evalpipe.cli prepare-data --train 300 --test 100
          python -m evalpipe.cli validate configs/broken.yaml && exit 1 || test $? -eq 2
